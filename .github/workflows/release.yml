# v4.6.0 客户端下载器主线：多平台构建 + Release 资产自动发布
# 触发：推送 v* 标签 或 手动 workflow_dispatch
name: Release v4.6.0+

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签 (如 v4.6.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===================== 纯 Go 二进制（全平台交叉编译） =====================
  build-go-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.version=${{ github.ref_name || inputs.tag }}" -o "tsg-${{ matrix.target }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binary-${{ matrix.target }}
          path: tsg-${{ matrix.target }}${{ matrix.ext }}
          retention-days: 1

  # ===================== Tauri 桌面客户端（三平台原生构建） =====================
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux-amd64
            rust_target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: darwin-amd64
            rust_target: x86_64-apple-darwin
          - platform: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - platform: windows-latest
            target: windows-amd64
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build sidecar binary
        env:
          GOOS: ${{ contains(matrix.target, 'linux') && 'linux' || contains(matrix.target, 'darwin') && 'darwin' || 'windows' }}
          GOARCH: ${{ contains(matrix.target, 'arm64') && 'arm64' || 'amd64' }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.version=${{ github.ref_name || inputs.tag }}" -o "src-tauri/binaries/tsg-${{ matrix.rust_target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}" .

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./src-tauri
          args: --target ${{ matrix.rust_target }}
          includeDebug: false
          includeRelease: true

      - name: Collect Tauri artifacts
        shell: bash
        run: |
          mkdir -p tauri-artifacts
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe tauri-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi tauri-artifacts/ 2>/dev/null || true
          elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg tauri-artifacts/ 2>/dev/null || true
            cp -r src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app tauri-artifacts/ 2>/dev/null || true
          else
            cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb tauri-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm tauri-artifacts/ 2>/dev/null || true
            cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage tauri-artifacts/ 2>/dev/null || true
          fi
          ls -la tauri-artifacts/

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: tauri-artifacts/*
          retention-days: 1

  # ===================== Android ARM64（v4.2.0+ 已有，这里补齐） =====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Android binary
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.version=${{ github.ref_name || inputs.tag }}" -o tsg-android-arm64 .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: go-binary-android-arm64
          path: tsg-android-arm64
          retention-days: 1

  # ===================== 发布：汇总所有资产到 GitHub Release =====================
  release:
    needs: [build-go-binaries, build-tauri, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize release assets
        run: |
          mkdir -p release-assets
          # Go 纯二进制
          for f in artifacts/go-binary-*/tsg-*; do
            [ -f "$f" ] || continue
            target=$(basename "$f" | sed 's/tsg-//')
            cp "$f" "release-assets/tsg-v${{ github.ref_name || inputs.tag }}-${target}"
          done
          # Android
          if [ -f artifacts/go-binary-android-arm64/tsg-android-arm64 ]; then
            cp artifacts/go-binary-android-arm64/tsg-android-arm64 "release-assets/tsg-v${{ github.ref_name || inputs.tag }}-android-arm64"
          fi
          # Tauri 安装器
          for d in artifacts/tauri-*; do
            [ -d "$d" ] || continue
            platform=$(basename "$d" | sed 's/tauri-//')
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              ext="${f##*.}"
              name=$(basename "$f")
              cp "$f" "release-assets/${name}"
            done
          done
          # 生成 SHA256SUMS
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ${{ github.ref_name || inputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
