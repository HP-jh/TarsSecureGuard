[package]
name = "tsg-desktop"
version = "4.11.0"
description = "TarsSecureGuard v4.11.0 桌面客户端（Tauri 壳，本地网关 sidecar 承载）"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tsg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v4.11.0 选型：Tauri 2.12 + tray-icon + image-png + updater
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# v4.11.0：tokio time 用于延迟更新检查
tokio = { version = "1", features = ["time"] }
# v4.11.0：轻量 HTTP 客户端（GitHub API 版本检测），体积远小于 reqwest
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
